name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --project backend --all-extras
      - name: Run e2e marker tests
        run: |
          cd backend
          python -m pytest -q -m e2e || true
