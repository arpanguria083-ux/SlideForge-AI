name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/pyproject.toml || true

      - name: Node audit
        run: |
          npm ci
          npm audit --audit-level=high || true
