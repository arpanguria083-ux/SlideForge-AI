[project]
name = "slideforge-backend"
version = "0.1.0"
description = "SlideForge AI - Offline-first Consulting Deck Evaluator"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "surya-ocr>=0.17.1",
    "transformers>=4.40.0,<5.0.0",
    "sentence-transformers>=3.0.0",
    "pdfplumber>=0.11.9",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "huggingface-hub>=0.23.2",
    "json-repair>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]
gpu = [
    "bitsandbytes>=0.43.0; sys_platform != 'win32'",
    "bitsandbytes-windows>=0.37.5; sys_platform == 'win32'",
]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
